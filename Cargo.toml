[package]
name = "smolworld"
version = "0.1.0"
edition = "2021"
description = "Minimal local L2 worlds for smolvm"

[dependencies]
blake3 = "1"
lexopt = "0.3"
toml = "0.8"
yaml-rust2 = "0.11"

[[bin]]
name = "smolworld"
path = "src/main.rs"

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true
